    <title>PERA</title>
    <script>
      // Two installable apps: customer (vrapzi.com) and staff (staff.vrapzi.com).
      // The staff app lives on its own subdomain so it installs as a separate
      // icon without clashing with the customer app's root scope.
      (function () {
        var host = location.hostname || "";
        var p = location.pathname || "";
        var staffHost = host.indexOf("staff.") === 0;
        var staffLook = staffHost || p.indexOf("/staff") === 0 || p.indexOf("/admin") === 0;
        var apply = function () {
          if (staffHost) {
            var l = document.querySelector('link[rel="manifest"]');
            if (!l) {
              l = document.createElement("link");
              l.rel = "manifest";
              document.head.appendChild(l);
            }
            l.href = "/staff.webmanifest";
          }
          if (staffLook) {
            var ti = document.querySelector('link[rel="apple-touch-icon"]');
            if (ti) ti.href = "/icons/staff-apple-180.png";
            var tt = document.querySelector('meta[name="apple-mobile-web-app-title"]');
            if (tt) tt.content = "PERA Staff";
            var th = document.querySelector('meta[name="theme-color"]');
            if (th) th.content = "#1a1816";
            document.title = "PERA Staff";
          }
        };
        if (staffLook) {
          apply();
          document.addEventListener("DOMContentLoaded", apply);
        }
      })();
    </script>
