    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="apple-touch-icon" href="/icons/apple-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

      rel="stylesheet"
    />
    <title>PERA</title>
    <script>
      // Two installable apps from one site: customer (default) and staff.
      // Switch the manifest + icon + title when on the staff/admin routes.
      (function () {
        var p = location.pathname || "";
        if (p.indexOf("/staff") === 0 || p.indexOf("/admin") === 0) {
          var apply = function () {
            var l = document.querySelector('link[rel="manifest"]');
            if (!l) {
              l = document.createElement("link");
              l.rel = "manifest";
              document.head.appendChild(l);
            }
            l.href = "/staff.webmanifest";
            var ti = document.querySelector('link[rel="apple-touch-icon"]');
            if (ti) ti.href = "/icons/staff-apple-180.png";
            var tt = document.querySelector('meta[name="apple-mobile-web-app-title"]');
            if (tt) tt.content = "PERA Staff";
            var th = document.querySelector('meta[name="theme-color"]');
            if (th) th.content = "#1a1816";
            document.title = "PERA Staff";
          };
          apply();
          document.addEventListener("DOMContentLoaded", apply);
        }
      })();
    </script>
